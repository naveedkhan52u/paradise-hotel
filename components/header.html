<!-- MASTER HEADER: Reuse this component on future pages -->
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md text-alpine-950 border-b border-sand-200 shadow-sm">
  <div class="max-w-[1440px] mx-auto px-3 sm:px-5 lg:px-8">
    <div class="flex items-center justify-between h-16 sm:h-[72px]">
      <a href="#home" class="flex items-center focus:outline-none group" aria-label="Paradise Grill Home">
        <img
          src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='250' height='58' viewBox='0 0 250 58'%3E%3Crect x='1' y='1' width='248' height='56' rx='14' fill='%2312201d'/%3E%3Crect x='4' y='4' width='242' height='50' rx='11' fill='none' stroke='%23d99b26' stroke-opacity='0.45' stroke-width='1.2'/%3E%3Cpath d='M24 38 L34 19 L43 32 L51 22 L61 38 Z' fill='%23f5b942'/%3E%3Ccircle cx='50' cy='15' r='3.5' fill='%23fff3d1'/%3E%3Ctext x='72' y='28' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%23ffffff' letter-spacing='0.8'%3EPARADISE GRILL%3C/text%3E%3Ctext x='73' y='43' font-family='Arial, sans-serif' font-weight='bold' font-size='8.5' fill='%23f5b942' letter-spacing='2.4'%3ESONIKOT %E2%80%A2 GILGIT%3C/text%3E%3C/svg%3E"
          alt="Paradise Grill — Sonikot, Gilgit"
          class="h-8 sm:h-9 w-auto max-w-[175px] object-contain rounded-lg shadow-sm group-hover:opacity-95 transition-opacity"
        />
      </a>

      <!-- Desktop master navigation -->
      <nav class="hidden lg:flex items-center gap-7 text-sm font-semibold" aria-label="Main navigation">
        <a href="#home" class="text-alpine-900 hover:text-amberwarm-600 transition-colors py-2">Home</a>
        <a href="#about" class="text-alpine-900 hover:text-amberwarm-600 transition-colors py-2">About</a>
        <a href="#rooms" class="text-alpine-900 hover:text-amberwarm-600 transition-colors py-2">Services</a>
        <a href="#contact" class="text-alpine-900 hover:text-amberwarm-600 transition-colors py-2">Contact</a>
      </nav>

      <div class="hidden lg:flex items-center">
        <button id="navCartBtn" onclick="openCartDrawer()" aria-label="Open Cart"
          class="relative inline-flex items-center gap-2 bg-alpine-900 hover:bg-alpine-800 text-white px-4 py-2.5 rounded-xl text-sm font-bold transition-all shadow-sm active:scale-95">
          <svg id="navCartIcon" class="w-5 h-5 text-amberwarm-400 transition-colors" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          <span>Cart</span>
          <span id="cartBadge" class="inline-flex items-center justify-center min-w-[22px] h-[22px] px-1.5 text-xs font-extrabold bg-amberwarm-400 text-alpine-950 rounded-full transition-transform">0</span>
        </button>
      </div>

      <!-- Tablet and mobile navigation uses a button row below, not a dropdown menu. -->
      <span class="lg:hidden text-xs font-semibold text-alpine-700">Hotel &amp; Restaurant</span>
    </div>
  </div>

  <!-- Tablet/mobile navigation buttons -->
  <nav class="lg:hidden border-t border-sand-200 bg-white px-2 py-2" aria-label="Mobile navigation">
    <div class="max-w-[1440px] mx-auto grid grid-cols-5 gap-1">
      <a href="#home" class="flex items-center justify-center min-h-10 rounded-lg bg-sand-100 px-1 py-2 text-[11px] sm:text-sm font-bold text-alpine-900 hover:bg-sand-200">Home</a>
      <a href="#about" class="flex items-center justify-center min-h-10 rounded-lg bg-sand-100 px-1 py-2 text-[11px] sm:text-sm font-bold text-alpine-900 hover:bg-sand-200">About</a>
      <a href="#rooms" class="flex items-center justify-center min-h-10 rounded-lg bg-sand-100 px-1 py-2 text-[11px] sm:text-sm font-bold text-alpine-900 hover:bg-sand-200">Services</a>
      <button type="button" onclick="openCartDrawer()" class="flex items-center justify-center min-h-10 rounded-lg bg-alpine-900 px-1 py-2 text-[11px] sm:text-sm font-bold text-white hover:bg-alpine-800">Cart</button>
      <a href="#contact" class="flex items-center justify-center min-h-10 rounded-lg bg-sand-100 px-1 py-2 text-[11px] sm:text-sm font-bold text-alpine-900 hover:bg-sand-200">Contact</a>
    </div>
  </nav>
</header>
