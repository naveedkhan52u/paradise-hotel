<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Paradise Grill Hotel | Gilgit</title>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
          },
          colors: {
            alpine: {
              950: '#0b1412',
              900: '#12201d',
              800: '#1b312c',
              700: '#26453e',
            },
            amberwarm: {
              400: '#f5b942',
              500: '#d99b26',
              600: '#b87d14',
            },
            sand: {
              50: '#faf9f6',
              100: '#f3f0ea',
              200: '#e6dfd3',
            }
          }
        }
      }
    };
  </script>

  <!-- Custom Utility Styles for Scrollbar & Animations -->
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #faf9f6;
      color: #12201d;
    }
    h1, h2, h3, .font-display {
      font-family: 'Playfair Display', serif;
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f3f0ea;
    }
    ::-webkit-scrollbar-thumb {
      background: #26453e;
      border-radius: 9999px;
    }
    /* Modal backdrop transition */
    .modal-enter {
      animation: fadeInScale 0.22s ease-out forwards;
    }
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-amberwarm-500 selection:text-white overflow-x-hidden">
<div id="site-header"></div>
<main class="min-h-[65vh]"><section id="about" class="py-10 sm:py-12 px-4 bg-white border-b border-sand-200">
    <div class="max-w-4xl mx-auto text-center">
      <span class="text-amberwarm-600 font-bold uppercase tracking-[0.2em] text-xs">About Us</span>
      <h2 class="font-display text-2xl sm:text-3xl font-bold text-alpine-950 mt-2">About Paradise Grill</h2>
      <p class="text-sm sm:text-base text-alpine-800/80 mt-3">Discover Paradise Grill Hotel and Restaurant in Gilgit. More information about our story, hospitality, facilities, and guest experience will be added here.</p>
    </div>
  </section></main>
<div id="site-footer"></div>
<script src="./assets/js/layout.js"></script>
</body>
</html>
